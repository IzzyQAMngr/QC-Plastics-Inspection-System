<div class="page-banner">
  <div class="page-banner-title">Daily Run Setup</div>
  <div class="page-head-actions">
    <div class="confirm-row">
      <select id="ar-confirmedBy"><option value="">— confirmed by —</option></select>
      <button id="ar-confirm-btn" class="ghost">Confirm Today's Runs</button>
    </div>
    <button id="ar-open-drawer-btn" class="primary">+ Add Run</button>
  </div>
</div>
<p class="page-sub">Set up once, active until stopped — nothing is ever deleted.</p>
<div class="form-loading-banner" id="ar-loading"><span class="spinner"></span> Loading form data…</div>

<div class="tiles" id="ar-tiles"></div>

<section class="card card-highlight">
  <div class="card-head-row">
    <div>
      <h2>Active Runs <span class="today-chip" id="ar-today-chip"></span></h2>
      <p class="spec-hint">What's running today, across every Line</p>
    </div>
  </div>
  <div id="ar-active-runs-table"></div>
</section>

<div class="drawer-overlay" id="ar-drawer-overlay"></div>
<div class="drawer" id="ar-drawer" role="dialog" aria-modal="true" aria-labelledby="ar-drawer-title">
  <div class="drawer-head">
    <div>
      <h2 id="ar-drawer-title">New Run</h2>
      <p>Add a Run to today's Active Runs list</p>
    </div>
    <button class="drawer-close" id="ar-drawer-close" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body">
    <div class="section-divider">Run Details</div>
    <div class="field-row-2">
      <div class="field"><label>Line #</label><select id="ar-line"><option value="">— select —</option></select></div>
      <div class="field"><label>Shift</label><select id="ar-shift"><option value="">— select —</option></select></div>
    </div>
    <div class="field"><label>Created By</label><select id="ar-createdBy"><option value="">— select —</option></select></div>

    <div class="section-divider">Mold &amp; Item</div>
    <div class="field"><label>Mold</label><div class="combo"><input id="ar-mold" placeholder="Start typing to search…"></div></div>
    <div class="field-row-2">
      <div class="field"><label>Mold Description</label><input id="ar-moldDescription" readonly></div>
      <div class="field"><label>Product Type</label><input id="ar-productType" readonly></div>
    </div>
    <div class="field"><label>Item</label><div class="combo"><input id="ar-item" placeholder="Start typing to search…"></div></div>
    <div class="field"><label>Item Description</label><input id="ar-itemDescription" readonly></div>

    <div class="section-divider">Order Info</div>
    <div class="field"><label>Resin Lot</label><input id="ar-resinLot"></div>
    <div class="field"><label>Customer Name (if available)</label><input id="ar-customerName"></div>
    <div class="field"><label>Run Qty (if available)</label><input id="ar-runQty" type="number"></div>
  </div>
  <div class="drawer-foot">
    <button class="ghost" id="ar-drawer-cancel">Cancel</button>
    <button class="primary" id="ar-add-btn">+ Add Run</button>
  </div>
</div>

<script>
  var arData = null;
  var AR_SKELETON_ROWS = 15;
  var AR_TABLE_COLGROUP =
    '<col style="width:12%"><col style="width:5%"><col style="width:11%"><col style="width:15%">' +
    '<col style="width:15%"><col style="width:11%"><col style="width:6%"><col style="width:8%">' +
    '<col style="width:9%"><col style="width:8%">';
  var AR_TABLE_HEADER =
    '<th>Run</th><th>Line</th><th>Shift / Start</th><th>Mold</th><th>Item</th>' +
    '<th>Customer</th><th style="text-align:right;">Qty</th><th>Qualified</th><th>Confirmed</th><th></th>';
  var AR_TABLE_COLS = AR_TABLE_HEADER.split('<th').length - 1;

  /** e.g. "8/20/2026, 5:17 PM" -> "8/20/2026 5:17 PM" (no time = "—"). */
  function fmtStartDate(v) {
    var d = v ? new Date(v) : null;
    if (!d || isNaN(d.getTime())) return '—';
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function fmtQty(q) {
    if (q === '' || q === null || q === undefined) return '—';
    var n = Number(q);
    return isNaN(n) ? esc(q) : n.toLocaleString();
  }

  function arSkeletonTableHtml() {
    var row = '<tr>' + new Array(AR_TABLE_COLS).fill('<td><span class="skeleton-bar"></span></td>').join('') + '</tr>';
    return '<div class="scroll-table-wrap"><table class="run-grid"><colgroup>' + AR_TABLE_COLGROUP +
      '</colgroup><thead><tr>' + AR_TABLE_HEADER +
      '</tr></thead><tbody>' + new Array(AR_SKELETON_ROWS).fill(row).join('') + '</tbody></table></div>';
  }
  document.getElementById('ar-active-runs-table').innerHTML = arSkeletonTableHtml();
  document.getElementById('ar-today-chip').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  function init_addrun() {
    google.script.run
      .withSuccessHandler(function (data) {
        arData = data;
        document.getElementById('ar-loading').classList.add('hidden');
        wireAddRunForm();
        renderActiveRunsTable();
        fillSelect('ar-confirmedBy', arData.createdByOptions);
      })
      .withFailureHandler(function (err) {
        document.getElementById('ar-loading').classList.add('hidden');
        showToast(err.message, true);
      })
      .getAddRunFormData();
  }

  function wireAddRunForm() {
    fillSelect('ar-line', arData.lines || []);
    fillSelect('ar-shift', arData.shifts);
    fillSelect('ar-createdBy', arData.createdByOptions);

    var moldItems = arData.molds.map(function (m) { return { value: m.moldId, label: m.moldId, sublabel: m.productType }; });
    initCombobox(document.getElementById('ar-mold'), moldItems, {
      onSelect: function (moldId, item) {
        var m = arData.molds.find(function (x) { return x.moldId === moldId; });
        document.getElementById('ar-productType').value = m ? m.productType : '';
        document.getElementById('ar-moldDescription').value = m ? m.description : '';
      },
      onInvalid: function () {
        document.getElementById('ar-productType').value = '';
        document.getElementById('ar-moldDescription').value = '';
      },
    });

    var itemItems = (arData.itemList || []).map(function (it) { return { value: it.itemNo, label: it.itemNo, sublabel: it.description }; });
    initCombobox(document.getElementById('ar-item'), itemItems, {
      onSelect: function (itemNo, item) { document.getElementById('ar-itemDescription').value = item.sublabel || ''; },
      onInvalid: function () { document.getElementById('ar-itemDescription').value = ''; },
    });

    document.getElementById('ar-add-btn').addEventListener('click', submitAddRun);
  }

  function resetAddRunFields() {
    ['ar-mold', 'ar-moldDescription', 'ar-productType', 'ar-item', 'ar-itemDescription', 'ar-resinLot', 'ar-customerName', 'ar-runQty'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('ar-line').value = '';
    document.getElementById('ar-shift').value = '';
    document.getElementById('ar-createdBy').value = '';
  }

  // ---- Slide-in Add Run drawer ----
  var arDrawer = document.getElementById('ar-drawer');
  var arDrawerOverlay = document.getElementById('ar-drawer-overlay');
  function arOpenDrawer() { arDrawerOverlay.classList.add('open'); arDrawer.classList.add('open'); }
  function arCloseDrawer() { arDrawerOverlay.classList.remove('open'); arDrawer.classList.remove('open'); }
  document.getElementById('ar-open-drawer-btn').addEventListener('click', arOpenDrawer);
  document.getElementById('ar-drawer-close').addEventListener('click', arCloseDrawer);
  document.getElementById('ar-drawer-cancel').addEventListener('click', arCloseDrawer);
  arDrawerOverlay.addEventListener('click', arCloseDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && arDrawer.classList.contains('open')) arCloseDrawer(); });

  function submitAddRun() {
    var line = document.getElementById('ar-line').value;
    var moldId = document.getElementById('ar-mold').value;
    var item = document.getElementById('ar-item').value;
    if (!line) { showToast('Pick a Line #.', true); return; }
    if (!moldId) { showToast('Pick a Mold.', true); return; }
    if (!item) { showToast('Pick an Item.', true); return; }
    var fields = {
      line: line,
      shift: document.getElementById('ar-shift').value,
      productType: document.getElementById('ar-productType').value,
      moldId: moldId,
      moldDescription: document.getElementById('ar-moldDescription').value,
      resinLot: document.getElementById('ar-resinLot').value,
      item: item,
      itemDescription: document.getElementById('ar-itemDescription').value,
      customerName: document.getElementById('ar-customerName').value,
      runQty: document.getElementById('ar-runQty').value,
      createdBy: document.getElementById('ar-createdBy').value,
    };
    var infoHtml =
      '<p>Add this to the Active Runs list?</p>' +
      '<table class="modal-info-table"><tbody>' +
        '<tr><th>Line</th><td>' + esc(fields.line) + '</td></tr>' +
        '<tr><th>Shift</th><td>' + esc(fields.shift) + '</td></tr>' +
        '<tr><th>Mold</th><td>' + esc(fields.moldId) + '</td></tr>' +
        '<tr><th>Item</th><td>' + esc(fields.item) + '</td></tr>' +
        '<tr><th>Customer</th><td>' + esc(fields.customerName) + '</td></tr>' +
        '<tr><th>Qty</th><td>' + esc(fields.runQty) + '</td></tr>' +
      '</tbody></table>';
    showConfirmModal('Add Run?', infoHtml, function () {
      google.script.run
        .withSuccessHandler(function (run) {
          arData.activeRuns.unshift(run);
          renderActiveRunsTable();
          resetAddRunFields();
          arCloseDrawer();
          showToast('Run ' + run.runId + ' created.');
        })
        .withFailureHandler(function (err) { showToast(err.message, true); })
        .addRun(fields);
    });
  }

  function sortByLine_(runs) {
    return runs.slice().sort(function (a, b) {
      var an = parseFloat(a.line), bn = parseFloat(b.line);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      return String(a.line).localeCompare(String(b.line));
    });
  }

  function renderTiles() {
    var runs = arData.activeRuns || [];
    var lineSet = {};
    runs.forEach(function (r) { lineSet[r.line] = true; });
    var linesCount = Object.keys(lineSet).length;
    var qualified = runs.filter(function (r) { return r.qualified === 'Yes'; }).length;
    var notQualified = runs.length - qualified;
    document.getElementById('ar-tiles').innerHTML =
      '<div class="tile"><div class="label">Active Runs</div><div class="value">' + runs.length + '</div></div>' +
      '<div class="tile"><div class="label">Lines Running</div><div class="value">' + linesCount + '</div></div>' +
      '<div class="tile"><div class="label">Qualified</div><div class="value good">' + qualified + '</div></div>' +
      '<div class="tile"><div class="label">Needs Qualification</div><div class="value' + (notQualified > 0 ? ' critical' : '') + '">' + notQualified + '</div></div>';
  }

  function renderActiveRunsTable() {
    var runs = sortByLine_(arData.activeRuns || []);
    var el = document.getElementById('ar-active-runs-table');
    renderTiles();
    if (runs.length === 0) { el.innerHTML = '<p class="spec-hint">No active runs yet — click "+ Add Run" to start one.</p>'; return; }
    var rowsHtml = runs.map(function (r) {
      var statusColor = r.qualified === 'Yes' ? 'var(--good)' : 'var(--critical)';
      var qualifiedBadge = r.qualified === 'Yes' ? '<span class="badge good">Qualified</span>' : '<span class="badge critical">Not Qualified</span>';
      var confirmedHtml = r.lastConfirmed
        ? '<span class="confirmed-yes"><span class="check">&#10003;</span>' + esc(r.lastConfirmedBy || '') + '</span>'
        : '<span class="confirmed-no">not yet today</span>';
      return '<tr style="--row-status-color:' + statusColor + '">' +
        '<td class="cell-mono">' + esc(r.runId) + '</td>' +
        '<td><span class="line-chip">' + esc(r.line) + '</span></td>' +
        '<td><div class="cell-primary">' + esc(r.shift) + '</div><div class="cell-secondary">' + esc(fmtStartDate(r.createdAt)) + '</div></td>' +
        '<td><div class="cell-primary">' + esc(r.moldId) + '</div><div class="cell-secondary">' + esc(r.moldDescription) + '</div></td>' +
        '<td><div class="cell-primary">' + esc(r.item) + '</div><div class="cell-secondary">' + esc(r.itemDescription) + '</div></td>' +
        '<td>' + esc(r.customerName) + '</td>' +
        '<td class="qty-cell cell-mono">' + fmtQty(r.runQty) + '</td>' +
        '<td>' + qualifiedBadge + '</td>' +
        '<td>' + confirmedHtml + '</td>' +
        '<td><button class="danger" data-stop-run="' + esc(r.runId) + '">Stop Run</button></td>' +
        '</tr>';
    }).join('');
    el.innerHTML = '<div class="scroll-table-wrap"><table class="run-grid"><colgroup>' + AR_TABLE_COLGROUP +
      '</colgroup><thead><tr>' + AR_TABLE_HEADER +
      '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-stop-run]'), function (btn) {
      btn.addEventListener('click', function () {
        var runId = btn.dataset.stopRun;
        var run = arData.activeRuns.find(function (r) { return r.runId === runId; });
        var infoHtml =
          '<p>Are you sure you want to end this run? It will drop off the Active Runs list.</p>' +
          '<table class="modal-info-table"><tbody>' +
            '<tr><th>Run ID</th><td>' + esc(run.runId) + '</td></tr>' +
            '<tr><th>Line</th><td>' + esc(run.line) + '</td></tr>' +
            '<tr><th>Shift</th><td>' + esc(run.shift) + '</td></tr>' +
            '<tr><th>Mold</th><td>' + esc(run.moldId) + '</td></tr>' +
            '<tr><th>Item</th><td>' + esc(run.item) + '</td></tr>' +
            '<tr><th>Customer</th><td>' + esc(run.customerName) + '</td></tr>' +
            '<tr><th>Qty</th><td>' + esc(run.runQty) + '</td></tr>' +
          '</tbody></table>';
        showConfirmModal('End Run ' + runId + '?', infoHtml, function () {
          google.script.run
            .withSuccessHandler(function () {
              arData.activeRuns = arData.activeRuns.filter(function (r) { return r.runId !== runId; });
              renderActiveRunsTable();
              showToast('Run ' + runId + ' stopped.');
            })
            .withFailureHandler(function (err) { showToast(err.message, true); })
            .endRun(runId);
        });
      });
    });
  }

  document.getElementById('ar-confirm-btn').addEventListener('click', function () {
    var confirmedBy = document.getElementById('ar-confirmedBy').value;
    if (!confirmedBy) { showToast('Pick who is confirming.', true); return; }
    google.script.run
      .withSuccessHandler(function (count) {
        var now = new Date().toISOString();
        (arData.activeRuns || []).forEach(function (r) { r.lastConfirmed = now; r.lastConfirmedBy = confirmedBy; });
        renderActiveRunsTable();
        showToast('Confirmed ' + count + ' active run(s) for today.');
      })
      .withFailureHandler(function (err) { showToast(err.message, true); })
      .confirmRunsToday(confirmedBy);
  });
</script>
