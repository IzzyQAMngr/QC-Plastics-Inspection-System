<h1 class="page-title">📊 Dashboard</h1>
<p class="page-sub">Live pass/fail performance and qualification status for every Line currently running a Plastics job.</p>

<div class="dash-summary">
  <div class="stat"><div class="num" id="dash-summary-count">—</div><div class="lbl">Lines Active</div></div>
  <div class="stat"><div class="num" id="dash-summary-qualified">—</div><div class="lbl">Qualified</div></div>
  <div class="spec-hint" id="dash-updated" style="align-self:center;"></div>
</div>

<p id="dash-loading" style="color:var(--text-muted);font-size:13px;">Loading dashboard…</p>
<div id="dash-empty" class="dash-empty hidden">No active Runs right now — start one from Daily Run Setup to see it here.</div>
<div class="line-cards-grid hidden" id="dash-line-cards"></div>

<script>
  var dashRefreshTimer_ = null;
  var DASH_REFRESH_MS_ = 60000;

  function init_dashboard() {
    loadDashboard_(true);
    if (!dashRefreshTimer_) {
      dashRefreshTimer_ = setInterval(function () { loadDashboard_(false); }, DASH_REFRESH_MS_);
    }
  }

  /** showLoadingState is true for the initial load (shows the loading text / toasts on
   *  failure); background auto-refreshes skip the loading flash and fail silently — a
   *  wall-mounted monitor shouldn't flicker or pop up an error toast every minute, it just
   *  tries again on the next tick. Skips entirely if the user has navigated to another view
   *  in this tab, so it's not silently polling the server for a page nobody's looking at. */
  function loadDashboard_(showLoadingState) {
    var view = document.getElementById('view-dashboard');
    if (!showLoadingState && view && !view.classList.contains('active')) return;
    if (showLoadingState) {
      document.getElementById('dash-loading').classList.remove('hidden');
      document.getElementById('dash-line-cards').classList.add('hidden');
      document.getElementById('dash-empty').classList.add('hidden');
    }
    google.script.run
      .withSuccessHandler(renderDashboard)
      .withFailureHandler(function (err) { if (showLoadingState) showToast(err.message, true); })
      .getPlasticsLineDashboardData();
  }

  function meterSeverity_(pct) {
    if (pct === null) return 'muted';
    if (pct >= 95) return 'good';
    if (pct >= 85) return 'warning';
    return 'critical';
  }

  function meterHtml_(label, metric) {
    var pct = metric.total ? Math.round((metric.pass / metric.total) * 1000) / 10 : null;
    var sev = meterSeverity_(pct);
    var pctText = pct === null ? 'No data' : pct + '%';
    var caption = metric.total
      ? (metric.pass + ' pass &middot; ' + metric.fail + ' fail (' + metric.total + ' total)')
      : 'No tests recorded yet';
    return '<div class="lc-meter">' +
      '<div class="lc-meter-label">' + label + '</div>' +
      '<div class="lc-meter-pct ' + sev + '">' + pctText + '</div>' +
      '<div class="meter-track"><div class="meter-fill ' + sev + '" style="width:' + (pct || 0) + '%;"></div></div>' +
      '<div class="lc-meter-caption">' + caption + '</div>' +
      '</div>';
  }

  function startedDateText_(createdAt) {
    var d = createdAt ? new Date(createdAt) : null;
    return (d && !isNaN(d.getTime())) ? d.toLocaleDateString() : '—';
  }

  function lineCardHtml_(c) {
    var qualBadge = c.qualified ? '<span class="badge good">&check; Qualified</span>' : '<span class="badge critical">Not Qualified</span>';
    var meta =
      'Mold <strong>' + esc(c.moldId || '—') + '</strong>' + (c.moldDescription ? ' — ' + esc(c.moldDescription) : '') + '<br>' +
      'Item ' + esc(c.item || '—') + (c.itemDescription ? ' — ' + esc(c.itemDescription) : '') + '<br>' +
      esc(c.customerName || 'No customer on file') + '<br>' +
      '<span class="spec-hint">Run ' + esc(c.runId) + (c.shift ? ' &middot; Shift ' + esc(c.shift) : '') +
      ' &middot; Started ' + startedDateText_(c.createdAt) + '</span>';
    return '<div class="line-card' + (c.qualified ? '' : ' not-qualified') + '">' +
      '<div class="line-card-head">' +
      '<div class="line-card-linenum"><small>Line</small>' + esc(c.line || '—') + '</div>' +
      qualBadge +
      '</div>' +
      '<div class="line-card-meta">' + meta + '</div>' +
      '<div class="line-card-meters">' +
      meterHtml_('In-Process', c.inProcess) +
      meterHtml_('Drop Freeze', c.dropFreeze) +
      '</div>' +
      '</div>';
  }

  function renderDashboard(data) {
    document.getElementById('dash-loading').classList.add('hidden');
    var cards = data.cards || [];
    var qualifiedCount = cards.filter(function (c) { return c.qualified; }).length;
    document.getElementById('dash-summary-count').textContent = cards.length;
    document.getElementById('dash-summary-qualified').textContent = cards.length ? (qualifiedCount + ' / ' + cards.length) : '—';
    var updatedAt = data.generatedAt ? new Date(data.generatedAt) : null;
    document.getElementById('dash-updated').textContent = updatedAt && !isNaN(updatedAt.getTime())
      ? 'Updated ' + updatedAt.toLocaleTimeString() + ' · refreshes every 60s'
      : '';

    var grid = document.getElementById('dash-line-cards');
    if (!cards.length) {
      grid.classList.add('hidden');
      document.getElementById('dash-empty').classList.remove('hidden');
      return;
    }
    grid.classList.remove('hidden');
    document.getElementById('dash-empty').classList.add('hidden');
    grid.innerHTML = cards.map(lineCardHtml_).join('');
  }
</script>
