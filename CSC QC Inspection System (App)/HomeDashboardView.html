<h1 class="page-title">Home</h1>
<p class="page-sub">Live performance across all inspection systems.</p>
<div id="home-loading" style="color:var(--text-muted);font-size:13px;">Loading dashboard…</div>
<div id="home-content" class="hidden">

  <section class="card">
    <h2>🧊 Plastics — Drop Freeze Testing</h2>
    <div class="tiles" id="df-tiles"></div>
    <div class="spec-hint" id="df-chart-label"></div>
    <div class="barchart" id="df-chart"></div>
  </section>

  <section class="card">
    <h2>📋 Plastics — In-Process Inspection</h2>
    <div class="tiles" id="ip-tiles"></div>
    <div class="spec-hint" id="ip-chart-label"></div>
    <div class="barchart" id="ip-chart"></div>
  </section>

  <section class="card">
    <h2>✅ Start-Up Verification</h2>
    <div class="tiles" id="su-tiles"></div>
    <div class="spec-hint" id="su-chart-label"></div>
    <div class="barchart" id="su-chart"></div>
  </section>

  <section class="card">
    <h2>⚙️ Metals Inspection</h2>
    <div class="placeholder-box">No Metals inspection data yet — this module is coming soon.</div>
  </section>

</div>

<script>
  function init_home() {
    document.getElementById('home-loading').classList.remove('hidden');
    document.getElementById('home-content').classList.add('hidden');
    google.script.run
      .withSuccessHandler(renderHome)
      .withFailureHandler(function (err) { showToast(err.message, true); })
      .getHomeDashboardData();
  }

  function homeTile(label, value, cls) {
    return '<div class="tile"><div class="label">' + label + '</div><div class="value ' + (cls || '') + '">' + value + '</div></div>';
  }

  function renderBarChart(elId, rows, valueKey, colorVar, emptyText) {
    var el = document.getElementById(elId);
    if (!rows || !rows.length) { el.innerHTML = '<p class="spec-hint">' + emptyText + '</p>'; return; }
    var max = Math.max.apply(null, rows.map(function (r) { return r[valueKey]; })) || 1;
    el.innerHTML = rows.map(function (r) {
      var pct = Math.round((r[valueKey] / max) * 100);
      return '<div class="bar-row">' +
        '<div class="bar-label">' + esc(r.label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(' + colorVar + ');"></div></div>' +
        '<div class="bar-value">' + r[valueKey] + '</div>' +
        '</div>';
    }).join('');
  }

  function renderHome(data) {
    document.getElementById('home-loading').classList.add('hidden');
    document.getElementById('home-content').classList.remove('hidden');

    var df = data.dropFreeze;
    document.getElementById('df-tiles').innerHTML = df.available ? [
      homeTile('Total Records', df.totalRecords),
      homeTile('Open', df.open, df.open > 0 ? 'warning' : ''),
      homeTile('Pass Rate', (df.passRate !== null ? df.passRate + '%' : '—'), 'good'),
      homeTile('Fails (7d)', df.failsThisWeek, df.failsThisWeek > 0 ? 'critical' : ''),
    ].join('') : homeTile('No data yet', '—');
    document.getElementById('df-chart-label').textContent = df.available && (df.byMold || []).length ? 'Fails by mold' : '';
    renderBarChart('df-chart', df.byMold, 'fail', '--critical', 'No fails recorded.');

    var ip = data.inProcess;
    document.getElementById('ip-tiles').innerHTML = ip.available ? [
      homeTile('Total Inspections', ip.totalRecords),
      homeTile('Dim. Pass Rate', (ip.dimPassRate !== null ? ip.dimPassRate + '%' : '—'), 'good'),
      homeTile('Fails (7d)', ip.failsThisWeek, ip.failsThisWeek > 0 ? 'critical' : ''),
    ].join('') : homeTile('No data yet', '—');
    document.getElementById('ip-chart-label').textContent = ip.available && (ip.byMold || []).length ? 'Fails by mold' : '';
    renderBarChart('ip-chart', ip.byMold, 'fail', '--critical', 'No fails recorded.');

    var su = data.startUp;
    document.getElementById('su-tiles').innerHTML = su.available ? [
      homeTile('Verifications', su.totalVerifications),
      homeTile('Runs Qualified', su.qualifiedRuns + ' / ' + su.totalRuns, 'good'),
      homeTile('Deviations Reported', su.deviationsReported, su.deviationsReported > 0 ? 'warning' : ''),
      homeTile('Pending Approvals', su.pendingApprovals, su.pendingApprovals > 0 ? 'critical' : ''),
    ].join('') : homeTile('No data yet', '—');
    document.getElementById('su-chart-label').textContent = su.available && (su.byMold || []).length ? 'Deviations by mold' : '';
    renderBarChart('su-chart', su.byMold, 'fail', '--warning', 'No deviations recorded.');
  }
</script>
