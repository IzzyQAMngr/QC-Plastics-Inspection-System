<div class="page-banner metals">
  <div class="page-banner-title">Daily Run Setup — Metals</div>
  <div class="page-head-actions">
    <div class="confirm-row">
      <select id="mar-confirmedBy"><option value="">— confirmed by —</option></select>
      <button id="mar-confirm-btn" class="ghost">Confirm Today's Runs</button>
    </div>
    <button id="mar-open-drawer-btn" class="primary">+ Add Run</button>
  </div>
</div>
<p class="page-sub">Set up once, active until stopped — nothing is ever deleted.</p>
<div class="form-loading-banner" id="mar-loading"><span class="spinner"></span> Loading form data…</div>

<div class="tiles" id="mar-tiles"></div>

<section class="card card-highlight metals">
  <div class="card-head-row">
    <div>
      <h2>Active Runs <span class="today-chip" id="mar-today-chip"></span></h2>
      <p class="spec-hint">What's running today, across every Line</p>
    </div>
  </div>
  <div id="mar-active-runs-table"></div>
</section>

<div class="drawer-overlay" id="mar-drawer-overlay"></div>
<div class="drawer" id="mar-drawer" role="dialog" aria-modal="true" aria-labelledby="mar-drawer-title">
  <div class="drawer-head">
    <div>
      <h2 id="mar-drawer-title">New Run</h2>
      <p>Add a Run to today's Active Runs list</p>
    </div>
    <button class="drawer-close" id="mar-drawer-close" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body">
    <div class="section-divider">Run Details</div>
    <div class="field-row-2">
      <div class="field"><label>Line #</label><select id="mar-line"><option value="">— select —</option></select></div>
      <div class="field"><label>Shift</label><select id="mar-shift"><option value="">— select —</option></select></div>
    </div>
    <div class="field"><label>Created By</label><select id="mar-createdBy"><option value="">— select —</option></select></div>

    <div class="section-divider">Can Size &amp; Item</div>
    <div class="field"><label>Can Size</label><div class="combo"><input id="mar-cansize" placeholder="Start typing to search…"></div></div>
    <div class="field-row-2">
      <div class="field"><label>Can Description</label><input id="mar-canDescription" readonly></div>
      <div class="field"><label>Product Type</label><input id="mar-productType" readonly></div>
    </div>
    <div class="field"><label>Item</label><div class="combo"><input id="mar-item" placeholder="Start typing to search…"></div></div>
    <div class="field"><label>Item Description</label><input id="mar-itemDescription" readonly></div>

    <div class="section-divider">Order Info</div>
    <div class="field"><label>Material Lot</label><input id="mar-materialLot" placeholder="Control Tag #"></div>
    <div class="field"><label>Customer Name (if available)</label><input id="mar-customerName"></div>
    <div class="field"><label>Run Qty (if available)</label><input id="mar-runQty" type="number"></div>
  </div>
  <div class="drawer-foot">
    <button class="ghost" id="mar-drawer-cancel">Cancel</button>
    <button class="primary" id="mar-add-btn">+ Add Run</button>
  </div>
</div>

<script>
  var marData = null;
  var MAR_SKELETON_ROWS = 15;
  var MAR_TABLE_COLGROUP =
    '<col style="width:12%"><col style="width:5%"><col style="width:11%"><col style="width:15%">' +
    '<col style="width:15%"><col style="width:11%"><col style="width:6%"><col style="width:8%">' +
    '<col style="width:9%"><col style="width:8%">';
  var MAR_TABLE_HEADER =
    '<th>Run</th><th>Line</th><th>Shift / Start</th><th>Can Size</th><th>Item</th>' +
    '<th>Customer</th><th style="text-align:right;">Qty</th><th>Qualified</th><th>Confirmed</th><th></th>';
  var MAR_TABLE_COLS = MAR_TABLE_HEADER.split('<th').length - 1;

  function marFmtQty(q) {
    if (q === '' || q === null || q === undefined) return '—';
    var n = Number(q);
    return isNaN(n) ? esc(q) : n.toLocaleString();
  }

  function marSkeletonTableHtml() {
    var row = '<tr>' + new Array(MAR_TABLE_COLS).fill('<td><span class="skeleton-bar"></span></td>').join('') + '</tr>';
    return '<div class="scroll-table-wrap"><table class="run-grid"><colgroup>' + MAR_TABLE_COLGROUP +
      '</colgroup><thead><tr>' + MAR_TABLE_HEADER +
      '</tr></thead><tbody>' + new Array(MAR_SKELETON_ROWS).fill(row).join('') + '</tbody></table></div>';
  }
  document.getElementById('mar-active-runs-table').innerHTML = marSkeletonTableHtml();
  document.getElementById('mar-today-chip').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  function init_metalsaddrun() {
    google.script.run
      .withSuccessHandler(function (data) {
        marData = data;
        document.getElementById('mar-loading').classList.add('hidden');
        wireMetalsAddRunForm();
        renderMetalsActiveRunsTable();
        fillSelect('mar-confirmedBy', marData.createdByOptions);
      })
      .withFailureHandler(function (err) {
        document.getElementById('mar-loading').classList.add('hidden');
        showToast(err.message, true);
      })
      .getAddMetalsRunFormData();
  }

  function wireMetalsAddRunForm() {
    fillSelect('mar-line', marData.lines || []);
    fillSelect('mar-shift', marData.shifts);
    fillSelect('mar-createdBy', marData.createdByOptions);

    var sizeItems = (marData.sizeCans || []).map(function (s) { return { value: s.sizeId, label: s.sizeId, sublabel: s.productType }; });
    initCombobox(document.getElementById('mar-cansize'), sizeItems, {
      onSelect: function (sizeId, item) {
        var s = marData.sizeCans.find(function (x) { return x.sizeId === sizeId; });
        document.getElementById('mar-productType').value = s ? s.productType : '';
        document.getElementById('mar-canDescription').value = s ? s.description : '';
      },
      onInvalid: function () {
        document.getElementById('mar-productType').value = '';
        document.getElementById('mar-canDescription').value = '';
      },
    });

    var itemItems = (marData.itemList || []).map(function (it) { return { value: it.itemNo, label: it.itemNo, sublabel: it.description }; });
    initCombobox(document.getElementById('mar-item'), itemItems, {
      onSelect: function (itemNo, item) { document.getElementById('mar-itemDescription').value = item.sublabel || ''; },
      onInvalid: function () { document.getElementById('mar-itemDescription').value = ''; },
    });

    document.getElementById('mar-add-btn').addEventListener('click', submitMetalsAddRun);
  }

  function resetMetalsAddRunFields() {
    ['mar-cansize', 'mar-canDescription', 'mar-productType', 'mar-item', 'mar-itemDescription', 'mar-materialLot', 'mar-customerName', 'mar-runQty'].forEach(function (id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('mar-line').value = '';
    document.getElementById('mar-shift').value = '';
    document.getElementById('mar-createdBy').value = '';
  }

  // ---- Slide-in Add Run drawer ----
  var marDrawer = document.getElementById('mar-drawer');
  var marDrawerOverlay = document.getElementById('mar-drawer-overlay');
  function marOpenDrawer() { marDrawerOverlay.classList.add('open'); marDrawer.classList.add('open'); }
  function marCloseDrawer() { marDrawerOverlay.classList.remove('open'); marDrawer.classList.remove('open'); }
  document.getElementById('mar-open-drawer-btn').addEventListener('click', marOpenDrawer);
  document.getElementById('mar-drawer-close').addEventListener('click', marCloseDrawer);
  document.getElementById('mar-drawer-cancel').addEventListener('click', marCloseDrawer);
  marDrawerOverlay.addEventListener('click', marCloseDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && marDrawer.classList.contains('open')) marCloseDrawer(); });

  function submitMetalsAddRun() {
    var line = document.getElementById('mar-line').value;
    var sizeId = document.getElementById('mar-cansize').value;
    var item = document.getElementById('mar-item').value;
    if (!line) { showToast('Pick a Line #.', true); return; }
    if (!sizeId) { showToast('Pick a Can Size.', true); return; }
    if (!item) { showToast('Pick an Item.', true); return; }
    var fields = {
      line: line,
      shift: document.getElementById('mar-shift').value,
      productType: document.getElementById('mar-productType').value,
      sizeId: sizeId,
      canDescription: document.getElementById('mar-canDescription').value,
      materialLot: document.getElementById('mar-materialLot').value,
      item: item,
      itemDescription: document.getElementById('mar-itemDescription').value,
      customerName: document.getElementById('mar-customerName').value,
      runQty: document.getElementById('mar-runQty').value,
      createdBy: document.getElementById('mar-createdBy').value,
    };
    var infoHtml =
      '<p>Add this to the Active Runs list?</p>' +
      '<table class="modal-info-table"><tbody>' +
        '<tr><th>Line</th><td>' + esc(fields.line) + '</td></tr>' +
        '<tr><th>Shift</th><td>' + esc(fields.shift) + '</td></tr>' +
        '<tr><th>Can Size</th><td>' + esc(fields.sizeId) + '</td></tr>' +
        '<tr><th>Item</th><td>' + esc(fields.item) + '</td></tr>' +
        '<tr><th>Customer</th><td>' + esc(fields.customerName) + '</td></tr>' +
        '<tr><th>Qty</th><td>' + esc(fields.runQty) + '</td></tr>' +
      '</tbody></table>';
    showConfirmModal('Add Run?', infoHtml, function () {
      google.script.run
        .withSuccessHandler(function (run) {
          marData.activeRuns.unshift(run);
          renderMetalsActiveRunsTable();
          resetMetalsAddRunFields();
          marCloseDrawer();
          showToast('Run ' + run.runId + ' created.');
        })
        .withFailureHandler(function (err) { showToast(err.message, true); })
        .addMetalsRun(fields);
    });
  }

  function sortByLine_(runs) {
    return runs.slice().sort(function (a, b) {
      var an = parseFloat(a.line), bn = parseFloat(b.line);
      if (!isNaN(an) && !isNaN(bn) && an !== bn) return an - bn;
      return String(a.line).localeCompare(String(b.line));
    });
  }

  function renderMetalsTiles() {
    var runs = marData.activeRuns || [];
    var lineSet = {};
    runs.forEach(function (r) { lineSet[r.line] = true; });
    var linesCount = Object.keys(lineSet).length;
    var qualified = runs.filter(function (r) { return r.qualified === 'Yes'; }).length;
    var notQualified = runs.length - qualified;
    document.getElementById('mar-tiles').innerHTML =
      '<div class="tile"><div class="label">Active Runs</div><div class="value">' + runs.length + '</div></div>' +
      '<div class="tile"><div class="label">Lines Running</div><div class="value">' + linesCount + '</div></div>' +
      '<div class="tile"><div class="label">Qualified</div><div class="value good">' + qualified + '</div></div>' +
      '<div class="tile"><div class="label">Needs Qualification</div><div class="value' + (notQualified > 0 ? ' critical' : '') + '">' + notQualified + '</div></div>';
  }

  function renderMetalsActiveRunsTable() {
    var runs = sortByLine_(marData.activeRuns || []);
    var el = document.getElementById('mar-active-runs-table');
    renderMetalsTiles();
    if (runs.length === 0) { el.innerHTML = '<p class="spec-hint">No active runs yet — click "+ Add Run" to start one.</p>'; return; }
    var rowsHtml = runs.map(function (r) {
      var statusColor = r.qualified === 'Yes' ? 'var(--good)' : 'var(--critical)';
      var qualifiedBadge = r.qualified === 'Yes' ? '<span class="badge good">Qualified</span>' : '<span class="badge critical">Not Qualified</span>';
      var confirmedHtml = r.lastConfirmed
        ? '<span class="confirmed-yes"><span class="check">&#10003;</span>' + esc(r.lastConfirmedBy || '') + '</span>'
        : '<span class="confirmed-no">not yet today</span>';
      return '<tr style="--row-status-color:' + statusColor + '">' +
        '<td class="cell-mono">' + esc(r.runId) + '</td>' +
        '<td><span class="line-chip metals">' + esc(r.line) + '</span></td>' +
        '<td><div class="cell-primary">' + esc(r.shift) + '</div><div class="cell-secondary">' + esc(fmtStartDate(r.createdAt)) + '</div></td>' +
        '<td><div class="cell-primary">' + esc(r.sizeId) + '</div><div class="cell-secondary">' + esc(r.canDescription) + '</div></td>' +
        '<td><div class="cell-primary">' + esc(r.item) + '</div><div class="cell-secondary">' + esc(r.itemDescription) + '</div></td>' +
        '<td>' + esc(r.customerName) + '</td>' +
        '<td class="qty-cell cell-mono">' + marFmtQty(r.runQty) + '</td>' +
        '<td>' + qualifiedBadge + '</td>' +
        '<td>' + confirmedHtml + '</td>' +
        '<td><button class="danger" data-stop-run="' + esc(r.runId) + '">Stop Run</button></td>' +
        '</tr>';
    }).join('');
    el.innerHTML = '<div class="scroll-table-wrap"><table class="run-grid"><colgroup>' + MAR_TABLE_COLGROUP +
      '</colgroup><thead><tr>' + MAR_TABLE_HEADER +
      '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
    Array.prototype.forEach.call(el.querySelectorAll('[data-stop-run]'), function (btn) {
      btn.addEventListener('click', function () {
        var runId = btn.dataset.stopRun;
        var run = marData.activeRuns.find(function (r) { return r.runId === runId; });
        var infoHtml =
          '<p>Are you sure you want to end this run? It will drop off the Active Runs list.</p>' +
          '<table class="modal-info-table"><tbody>' +
            '<tr><th>Run ID</th><td>' + esc(run.runId) + '</td></tr>' +
            '<tr><th>Line</th><td>' + esc(run.line) + '</td></tr>' +
            '<tr><th>Shift</th><td>' + esc(run.shift) + '</td></tr>' +
            '<tr><th>Can Size</th><td>' + esc(run.sizeId) + '</td></tr>' +
            '<tr><th>Item</th><td>' + esc(run.item) + '</td></tr>' +
            '<tr><th>Customer</th><td>' + esc(run.customerName) + '</td></tr>' +
            '<tr><th>Qty</th><td>' + esc(run.runQty) + '</td></tr>' +
          '</tbody></table>';
        showConfirmModal('End Run ' + runId + '?', infoHtml, function () {
          google.script.run
            .withSuccessHandler(function () {
              marData.activeRuns = marData.activeRuns.filter(function (r) { return r.runId !== runId; });
              renderMetalsActiveRunsTable();
              showToast('Run ' + runId + ' stopped.');
            })
            .withFailureHandler(function (err) { showToast(err.message, true); })
            .endMetalsRun(runId);
        });
      });
    });
  }

  document.getElementById('mar-confirm-btn').addEventListener('click', function () {
    var confirmedBy = document.getElementById('mar-confirmedBy').value;
    if (!confirmedBy) { showToast('Pick who is confirming.', true); return; }
    google.script.run
      .withSuccessHandler(function (count) {
        var now = new Date().toISOString();
        (marData.activeRuns || []).forEach(function (r) { r.lastConfirmed = now; r.lastConfirmedBy = confirmedBy; });
        renderMetalsActiveRunsTable();
        showToast('Confirmed ' + count + ' active run(s) for today.');
      })
      .withFailureHandler(function (err) { showToast(err.message, true); })
      .confirmMetalsRunsToday(confirmedBy);
  });
</script>
