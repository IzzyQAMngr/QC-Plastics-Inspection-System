<h1 class="page-title">🏷️ Print PFA Tag</h1>
<p class="page-sub">Pull up an already-qualified Run's Production First Article tag to reprint it — start typing a Run ID, Verification Record #, or PFA ID and pick it from the list, across both Plastics and Metals.</p>

<section class="card">
  <h2>Find a Record</h2>
  <div class="field-row">
    <div class="field field-wide">
      <label>Run ID, Verification Record #, or PFA ID</label>
      <input type="text" id="pfat-search" placeholder="Start typing to search…">
    </div>
  </div>
  <div id="pfat-results"></div>
</section>

<script>
  var pfatIndex_ = [];

  function init_pfatag() { loadPfatIndex_(); }

  // Re-loaded every time you navigate back in (not just on first load) — a Start-Up
  // Verification finished moments ago in the same session needs to show up here right away.
  function onshow_pfatag() { loadPfatIndex_(); }

  function loadPfatIndex_() {
    var box = document.getElementById('pfat-results');
    box.innerHTML = '<p class="spec-hint">Loading qualified records…</p>';
    google.script.run
      .withSuccessHandler(function (matches) {
        pfatIndex_ = matches || [];
        box.innerHTML = pfatIndex_.length ? '' : '<p class="spec-hint">No qualified records found yet.</p>';
        var items = pfatIndex_.map(function (m, i) {
          return {
            value: i,
            label: [m.runId, m.recordId, m.pfaId].filter(Boolean).join(' · '),
            sublabel: [m.department, m.itemNo, m.itemDescription].filter(Boolean).join(' — ') +
              (m.qualifiedBy ? ' · Qualified by ' + m.qualifiedBy : ''),
          };
        });
        var input = document.getElementById('pfat-search');
        input.value = '';
        initCombobox(input, items, {
          onSelect: function (idx) { pfatRenderResults_([pfatIndex_[idx]]); },
        });
      })
      .withFailureHandler(function (err) {
        box.innerHTML = '';
        showToast(err.message, true);
      })
      .getPfaTagIndex();
  }

  function pfatRenderResults_(matches) {
    var box = document.getElementById('pfat-results');
    if (!matches || !matches.length) {
      box.innerHTML = '<p class="spec-hint">No qualified record found for that search.</p>';
      return;
    }
    var rows = matches.map(function (m, i) {
      return '<tr>' +
        '<td>' + esc(m.department) + '</td>' +
        '<td>' + esc(m.runId) + '</td>' +
        '<td>' + esc(m.itemNo) + (m.itemDescription ? ' — ' + esc(m.itemDescription) : '') + '</td>' +
        '<td>' + esc(m.qualifiedBy) + '</td>' +
        '<td>' + esc((m.qualifiedDate + ' ' + m.qualifiedTime).trim()) + '</td>' +
        '<td><button class="ghost" data-idx="' + i + '">View &amp; Print</button></td>' +
      '</tr>';
    }).join('');
    box.innerHTML = '<div style="overflow-x:auto;margin-top:12px;"><table class="qc-table"><thead><tr>' +
      '<th>Dept</th><th>Run ID</th><th>Item</th><th>Qualified By</th><th>Qualified</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    box.querySelectorAll('button[data-idx]').forEach(function (btn) {
      btn.addEventListener('click', function () { pfaShowPreview_(matches[Number(btn.getAttribute('data-idx'))]); });
    });
  }
</script>
