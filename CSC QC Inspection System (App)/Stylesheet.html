<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page-plane: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-1-dark: #184f95;
    --good: #0ca30c;
    --warning: #b8790f;
    --serious: #ec835a;
    --critical: #d03b3b;
    --good-bg: #e6f6e6;
    --warning-bg: #fdf1de;
    --critical-bg: #fbe6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff;
      --text-secondary: #c3c2b7; --text-muted: #898781; --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10); --series-1: #3987e5; --series-1-dark: #6da7ec;
      --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
      --good-bg: #123312; --warning-bg: #3a2c0d; --critical-bg: #3a1414;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #ffffff;
    --text-secondary: #c3c2b7; --text-muted: #898781; --gridline: #2c2c2a;
    --border: rgba(255,255,255,0.10); --series-1: #3987e5; --series-1-dark: #6da7ec;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
    --good-bg: #123312; --warning-bg: #3a2c0d; --critical-bg: #3a1414;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane); color: var(--text-primary);
  }
  #app { display: flex; min-height: 100vh; }

  /* ---- Side nav ---- */
  #sidenav {
    width: 220px; flex: 0 0 220px; background: var(--surface-1);
    border-right: 1px solid var(--border); padding: 20px 12px; position: sticky; top: 0; height: 100vh;
  }
  #sidenav .brand { font-weight: 700; font-size: 15px; padding: 0 10px 18px; letter-spacing: 0.2px; }
  #sidenav .brand small { display: block; font-weight: 400; color: var(--text-muted); font-size: 11px; margin-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
    color: var(--text-secondary); cursor: pointer; font-size: 14px; margin-bottom: 2px; user-select: none;
  }
  .nav-item:hover { background: var(--gridline); color: var(--text-primary); }
  .nav-item.active { background: var(--series-1); color: #fff; }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  /* ---- Main content ---- */
  #main { flex: 1; padding: 28px 32px; max-width: 1200px; }
  .view { display: none; }
  .view.active { display: block; }
  h1.page-title { font-size: 22px; margin: 0 0 4px; }
  p.page-sub { color: var(--text-secondary); margin: 0 0 24px; font-size: 13.5px; }

  /* ---- Stat tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .tile .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .value.good { color: var(--good); }
  .tile .value.critical { color: var(--critical); }
  .tile .value.warning { color: var(--warning); }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 20px;
  }
  section.card h2 { font-size: 15px; margin: 0 0 14px; }

  table.qc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.qc-table th, table.qc-table td {
    text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums;
  }
  table.qc-table th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.critical { background: var(--critical-bg); color: var(--critical); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); }

  /* ---- Forms ---- */
  label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-1); color: var(--text-primary); font-size: 13.5px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  .field { margin-bottom: 12px; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 16px; border-radius: 7px;
    border: 1px solid var(--border); cursor: pointer; background: var(--surface-1); color: var(--text-primary);
  }
  button.primary { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  button.primary:hover { background: var(--series-1-dark); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .row-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; background: var(--page-plane); }
  .row-card .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .row-card .row-head .tag { font-size: 12px; color: var(--text-muted); }

  .spec-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  input.oos { border-color: var(--critical); background: var(--critical-bg); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--text-primary); color: var(--surface-1);
    padding: 10px 16px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--critical); }

  .line-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .line-tab {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .line-tab.active { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.good { background: var(--good); }
  .dot.critical { background: var(--critical); }

  .placeholder-box {
    border: 1px dashed var(--border); border-radius: 10px; padding: 40px 20px; text-align: center; color: var(--text-muted);
  }
  .hidden { display: none !important; }
</style>
