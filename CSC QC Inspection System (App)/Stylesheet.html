<style>
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --page-plane: #f2f4f6;
    --header-bg: #e9edf0;
    --row-alt: #f6f8f9;
    --text-primary: #1b2530;
    --text-secondary: #4c5c6c;
    --text-muted: #8996a4;
    --gridline: #d7dde2;
    --border: #c7d0d8;
    --series-1: #2f5d8a;
    --series-1-dark: #1f4266;
    --accent-2: #35553c;
    --accent-2-dark: #24402c;
    --good: #2f6b3a;
    --warning: #8a5a12;
    --serious: #a15a2a;
    --critical: #8f2f2f;
    --good-bg: #e8f1e9;
    --warning-bg: #f5ecd9;
    --serious-bg: #f3e6dc;
    --critical-bg: #f5e6e6;
    --nav-bg: #212d37;
    --nav-border: rgba(255,255,255,0.08);
    --nav-text: #e7ecef;
    --nav-text-dim: rgba(231,236,239,0.68);
    --nav-active-bg: rgba(255,255,255,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a2229; --page-plane: #12181d; --header-bg: #202b33; --row-alt: #1e262d;
      --text-primary: #e8ecef; --text-secondary: #9fadb9; --text-muted: #71818f; --gridline: #34424e;
      --border: #3f4e5b; --series-1: #6f9fc9; --series-1-dark: #a9c8e2;
      --accent-2: #7fae87; --accent-2-dark: #a3c7a8;
      --good: #7fae87; --warning: #d3a24d; --serious: #d99a6c; --critical: #d68787;
      --good-bg: #1c2921; --warning-bg: #332818; --serious-bg: #332420; --critical-bg: #331e1e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a2229; --page-plane: #12181d; --header-bg: #202b33; --row-alt: #1e262d;
    --text-primary: #e8ecef; --text-secondary: #9fadb9; --text-muted: #71818f; --gridline: #34424e;
    --border: #3f4e5b; --series-1: #6f9fc9; --series-1-dark: #a9c8e2;
    --accent-2: #7fae87; --accent-2-dark: #a3c7a8;
    --good: #7fae87; --warning: #d3a24d; --serious: #d99a6c; --critical: #d68787;
    --good-bg: #1c2921; --warning-bg: #332818; --serious-bg: #332420; --critical-bg: #331e1e;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane); color: var(--text-primary);
  }
  #app { display: flex; min-height: 100vh; }

  /* ---- Side nav ---- */
  #sidenav {
    width: 220px; flex: 0 0 220px; background: var(--nav-bg);
    border-right: 1px solid var(--nav-border); padding: 20px 0; position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  #sidenav .brand { font-weight: 700; font-size: 15px; padding: 0 20px 18px; letter-spacing: 0.2px; color: var(--nav-text); border-bottom: 1px solid var(--nav-border); margin-bottom: 10px; }
  #sidenav .brand small { display: block; font-weight: 400; color: var(--nav-text-dim); font-size: 10.5px; margin-top: 3px; letter-spacing: 0.05em; text-transform: uppercase; }
  /* Excel-style grid: each department's items sit in one bordered "column" range, one row
     per menu item, gridlines between rows like adjacent spreadsheet cells. */
  .nav-group {
    margin: 0 14px 16px; border: 1px solid var(--nav-border);
  }
  .nav-item {
    display: flex; align-items: center; padding: 9px 14px; border-radius: 0;
    border-left: 3px solid transparent; border-bottom: 1px solid var(--nav-border);
    color: var(--nav-text-dim); cursor: pointer; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; user-select: none;
  }
  .nav-item:last-child { border-bottom: none; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--nav-text); }
  .nav-item.active { background: var(--nav-active-bg); color: var(--nav-text); border-left-color: var(--series-1); font-weight: 700; }
  .nav-group-label {
    padding: 18px 20px 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--nav-text); display: flex; align-items: center; gap: 7px;
  }
  .nav-group-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--series-1); flex: 0 0 auto; }

  /* ---- Main content ---- */
  #main { flex: 1; padding: 28px 32px; max-width: 1200px; }
  .view { display: none; }
  .view.active { display: block; }

  /* Always-visible department context strip — sticks to the top of the viewport while a
     long form scrolls, so it's never ambiguous which department's data you're touching.
     Negative margins cancel #main's own padding so it spans flush edge-to-edge; its own
     padding re-establishes the page's usual left/right text alignment. */
  .dept-banner {
    position: sticky; top: 0; z-index: 10; margin: -28px -32px 24px; padding: 9px 32px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; display: flex; align-items: center; gap: 8px;
  }
  .dept-banner::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.85; }
  .dept-banner.plastics { background: var(--series-1); }
  .dept-banner.metals { background: var(--accent-2); }
  h1.page-title { font-size: 22px; margin: 0 0 4px; }
  p.page-sub { color: var(--text-secondary); margin: 0 0 24px; font-size: 13.5px; }
  .page-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .page-title-row .page-title { margin: 0; }
  .form-rev-info { font-size: 11px; line-height: 1.5; color: var(--text-muted); text-align: right; white-space: nowrap; padding-top: 3px; }

  /* ---- Stat tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; margin-bottom: 24px; background: var(--border); border: 1px solid var(--border); }
  .tile {
    background: var(--surface-1); border-radius: 0; padding: 14px 16px;
  }
  .tile .label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .value { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .value.good { color: var(--good); }
  .tile .value.critical { color: var(--critical); }
  .tile .value.warning { color: var(--warning); }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 0;
    padding: 18px 20px; margin-bottom: 20px;
  }
  section.card h2 { font-size: 15px; margin: 0 0 14px; }

  table.qc-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--gridline); }
  table.qc-table th, table.qc-table td {
    text-align: left; padding: 4px 10px; border: 1px solid var(--gridline); font-variant-numeric: tabular-nums; line-height: 1.3;
  }
  table.qc-table th { background: var(--header-bg); color: var(--text-secondary); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.qc-table tbody tr:nth-child(even) td { background: var(--row-alt); }

  /* Scrollable table with a frozen (sticky) header row — used by Data Analysis
     and the Add Run active-runs grids. */
  .scroll-table-wrap { overflow: auto; max-height: 60vh; }
  .scroll-table-wrap table.qc-table th { position: sticky; top: 0; z-index: 2; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; border-radius: 0; border-left: 3px solid; font-size: 12px; font-weight: 600; }
  .badge.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .badge.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical); }
  .badge.serious { background: var(--serious-bg); color: var(--serious); border-color: var(--serious); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

  /* ---- Forms ---- */
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, select, textarea {
    width: 100%; padding: 5px 9px; border: 1px solid var(--border); border-radius: 0;
    background: var(--surface-1); color: var(--text-primary); font-size: 13.5px; font-family: inherit; line-height: 1.3;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  textarea { min-height: 60px; resize: vertical; font-family: inherit; }
  .field { margin-bottom: 8px; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .field.field-wide { grid-column: span 2; }

  .section-divider {
    background: var(--page-plane); border: 1px solid var(--border); border-left: 3px solid var(--series-1);
    padding: 3px 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-secondary); margin: 10px 0 8px;
  }
  .row-card .section-divider { margin-top: 0; }

  /* Compact variant — used by the Add Run entry form so it takes up less room and
     doesn't compete visually with the Active Runs list below it. */
  .form-compact label { font-size: 10px; margin-bottom: 2px; }
  .form-compact input, .form-compact select { font-size: 12px; padding: 4px 7px; }
  .form-compact .field { margin-bottom: 6px; }
  .form-compact h2 { font-size: 13px; }

  /* Emphasis variant — used by the Active Runs list so it stands out as the primary,
     glanceable content on the page rather than the entry form above it. */
  section.card.card-highlight { border-left: 4px solid var(--series-1); }
  section.card.card-highlight.metals { border-left-color: var(--accent-2); }
  section.card.card-highlight h2 { font-size: 17px; }

  /* Fixed-layout run tables — column widths stay put as rows are added/removed instead
     of reflowing, and the Line # stands out in bold. */
  /* Smaller font/padding than the base qc-table — the Active Runs table carries enough
     columns (Run ID, Line, Start Shift, Start Date, Mold Description, Item, Item
     Description, Customer, Qty, Qualified, Last Confirmed By, action) that the default
     size doesn't comfortably fit. */
  table.run-table { table-layout: fixed; font-size: 11.5px; }
  table.run-table th, table.run-table td { padding: 3px 6px; white-space: normal; word-break: break-word; }
  table.run-table td.run-line { font-weight: 700; }

  table.dim-table { table-layout: fixed; }
  table.dim-table th, table.dim-table td { padding: 4px 8px; }
  table.dim-table col.dim-narrow { width: 62px; }
  table.dim-table col.dim-value-col { width: 124px; }
  table.dim-table th, table.dim-table td { font-variant-numeric: tabular-nums; }
  table.dim-table td.dim-value input { width: 100%; min-width: 0; padding: 4px 6px; }
  table.dim-table td.dim-remark { white-space: nowrap; }

  button {
    font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 16px; border-radius: 0;
    border: 1px solid var(--border); cursor: pointer; background: var(--surface-1); color: var(--text-primary);
  }
  button.primary { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  button.primary:hover { background: var(--series-1-dark); }
  button.secondary { background: var(--accent-2); color: #fff; border-color: var(--accent-2); }
  button.danger { background: var(--critical-bg); color: var(--critical); border-color: var(--critical); }
  button.danger:hover { background: var(--critical); color: #fff; }
  button.secondary:hover { background: var(--accent-2-dark); }
  button.ghost { background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .row-card { border: 1px solid var(--border); border-radius: 0; padding: 14px; margin-bottom: 12px; background: var(--surface-1); }
  .row-card .row-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .row-card .row-head .tag { font-size: 12px; color: var(--text-muted); }

  .spec-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

  .spinner {
    display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border);
    border-top-color: var(--series-1); border-radius: 50%; vertical-align: -2px; margin-right: 7px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .form-loading-banner {
    display: flex; align-items: center; font-size: 13px; color: var(--text-muted);
    background: var(--page-plane); border: 1px solid var(--border); border-left: 3px solid var(--series-1);
    padding: 8px 12px; margin-bottom: 16px;
  }

  /* Skeleton placeholder rows/bars — shown in place of a table or field before its data
     has loaded, so the page keeps its final layout/height from the first paint instead of
     looking blank (or jumping around) while google.script.run is still in flight. */
  .skeleton-bar {
    display: inline-block; height: 10px; width: 70%; border-radius: 1px;
    background: linear-gradient(90deg, var(--gridline) 25%, var(--border) 37%, var(--gridline) 63%);
    background-size: 400% 100%; animation: skeleton-pulse 1.4s ease infinite;
  }
  @keyframes skeleton-pulse { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  input.oos { border-color: var(--critical); background: var(--critical-bg); }
  input.oos-review { border-color: var(--serious); background: var(--serious-bg); }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--text-primary); color: var(--surface-1);
    padding: 10px 16px; border-radius: 0; font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--critical); }

  /* ---- Shared Yes/No confirmation modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(10,14,18,0.55);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 0;
    width: 100%; max-width: 380px; margin: 20px; box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }
  .modal-header {
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary);
  }
  .modal-body { padding: 16px; font-size: 13.5px; color: var(--text-primary); }
  .modal-body p { margin: 0 0 12px; }
  table.modal-info-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.modal-info-table th, table.modal-info-table td {
    text-align: left; padding: 4px 8px; border: 1px solid var(--gridline);
  }
  table.modal-info-table th {
    background: var(--header-bg); color: var(--text-secondary); font-weight: 700; width: 40%;
    text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.04em;
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
  }

  .line-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .line-tab {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 0;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .line-tab.active { background: var(--series-1); color: #fff; border-color: var(--series-1); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.good { background: var(--good); }
  .dot.serious { background: var(--serious); }
  .dot.critical { background: var(--critical); }

  .barchart { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .barchart .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .barchart .bar-label {
    width: 130px; flex: 0 0 130px; text-align: right; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .barchart .bar-track { flex: 1; background: var(--gridline); border-radius: 0; height: 14px; overflow: hidden; border: 1px solid var(--border); }
  .barchart .bar-fill { height: 100%; border-radius: 0; min-width: 2px; }
  .barchart .bar-value { flex: 0 0 34px; font-variant-numeric: tabular-nums; color: var(--text-muted); }

  .placeholder-box {
    border: 1px dashed var(--border); border-radius: 0; padding: 40px 20px; text-align: center; color: var(--text-muted);
  }
  .hidden { display: none !important; }

  /* ---- Plastics Dashboard — one card per active Run, built for a big lab monitor ---- */
  .dash-summary { display: flex; gap: 32px; align-items: baseline; margin-bottom: 22px; flex-wrap: wrap; }
  .dash-summary .stat .num {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 30px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .dash-summary .stat .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

  .line-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); gap: 18px; }

  .line-card {
    background: var(--surface-1); border: 1px solid var(--border); border-left: 5px solid var(--good);
    padding: 18px 20px;
  }
  .line-card.not-qualified { border-left-color: var(--critical); }

  .line-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .line-card-linenum { font-size: 24px; font-weight: 800; line-height: 1; }
  .line-card-linenum small {
    display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 3px;
  }

  .line-card-meta { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 18px; }
  .line-card-meta strong { color: var(--text-primary); }

  .line-card-meters { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .lc-meter { min-width: 0; }
  .lc-meter:first-child { border-right: 1px solid var(--gridline); padding-right: 18px; }
  .lc-meter-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 5px; }
  .lc-meter-pct {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 25px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .lc-meter-pct.good { color: var(--good); }
  .lc-meter-pct.warning { color: var(--warning); }
  .lc-meter-pct.critical { color: var(--critical); }
  .lc-meter-pct.muted { color: var(--text-muted); font-size: 15px; font-weight: 600; }
  .meter-track { background: var(--gridline); border: 1px solid var(--border); height: 10px; margin: 7px 0 6px; overflow: hidden; }
  .meter-fill { height: 100%; }
  .meter-fill.good { background: var(--good); }
  .meter-fill.warning { background: var(--warning); }
  .meter-fill.critical { background: var(--critical); }
  .lc-meter-caption { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .dash-empty {
    border: 1px dashed var(--border); padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 13.5px;
  }

  /* ---- Checkbox-driven Pass/Fail/N/A tables (Start-Up Verification checklist) ---- */
  table.suv-checklist-table th.suv-check-col, table.suv-checklist-table td.suv-check-cell { width: 64px; text-align: center; }
  table.suv-checklist-table td.suv-check-cell input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--series-1); }

  /* ---- Data Analysis: dense Excel-like grid — small font, frozen header, sortable ---- */
  #tdr-table { font-size: 11.5px; }
  #tdr-table th, #tdr-table td { white-space: nowrap; vertical-align: middle; padding: 4px 8px; }
  #tdr-table th { cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 2; }
  #tdr-table th .sort-arrow { margin-left: 4px; color: var(--text-muted); }

  /* Min/avg/max range bar — a single marker's position between two endpoints, used when a
     Characteristic filter narrows the numeric value column to one comparable unit. */
  .range-bar-track {
    position: relative; height: 8px; background: var(--gridline); border: 1px solid var(--border);
    border-radius: 4px; margin: 8px 0 4px;
  }
  .range-bar-marker {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: var(--series-1); border: 2px solid var(--surface-1); box-shadow: 0 0 0 1px var(--series-1);
    transform: translate(-50%, -50%);
  }
  .range-bar-labels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-secondary); }
  .range-bar-labels b { color: var(--text-primary); font-variant-numeric: tabular-nums; }

  /* ---- Print: strip nav/chrome so a form can be printed blank and filled by hand ---- */
  @media print {
    #sidenav, .toast, .combo-list, button, .dept-banner, .modal-overlay { display: none !important; }
    #main { padding: 0; max-width: none; }
    body { background: #fff; }
    section.card { border: 1px solid #000; box-shadow: none; break-inside: avoid; }
    input, select, textarea { border: 1px solid #000; color: #000; }
    .section-divider { border: 1px solid #000; border-left-width: 3px; }
  }
</style>
