<style>
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --page-plane: #f2f4f6;
    --header-bg: #e9edf0;
    --row-alt: #f6f8f9;
    --text-primary: #1b2530;
    --text-secondary: #4c5c6c;
    --text-muted: #8996a4;
    --gridline: #d7dde2;
    --border: #c7d0d8;
    --series-1: #2f5d8a;
    --series-1-dark: #1f4266;
    --accent-2: #35553c;
    --accent-2-dark: #24402c;
    --good: #2f6b3a;
    --warning: #8a5a12;
    --serious: #a15a2a;
    --critical: #8f2f2f;
    --good-bg: #e8f1e9;
    --warning-bg: #f5ecd9;
    --serious-bg: #f3e6dc;
    --critical-bg: #f5e6e6;
    --nav-bg: #212d37;
    --nav-border: rgba(255,255,255,0.08);
    --nav-text: #e7ecef;
    --nav-text-dim: rgba(231,236,239,0.68);
    --nav-active-bg: rgba(255,255,255,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a2229; --page-plane: #12181d; --header-bg: #202b33; --row-alt: #1e262d;
      --text-primary: #e8ecef; --text-secondary: #9fadb9; --text-muted: #71818f; --gridline: #34424e;
      --border: #3f4e5b; --series-1: #6f9fc9; --series-1-dark: #a9c8e2;
      --accent-2: #7fae87; --accent-2-dark: #a3c7a8;
      --good: #7fae87; --warning: #d3a24d; --serious: #d99a6c; --critical: #d68787;
      --good-bg: #1c2921; --warning-bg: #332818; --serious-bg: #332420; --critical-bg: #331e1e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a2229; --page-plane: #12181d; --header-bg: #202b33; --row-alt: #1e262d;
    --text-primary: #e8ecef; --text-secondary: #9fadb9; --text-muted: #71818f; --gridline: #34424e;
    --border: #3f4e5b; --series-1: #6f9fc9; --series-1-dark: #a9c8e2;
    --accent-2: #7fae87; --accent-2-dark: #a3c7a8;
    --good: #7fae87; --warning: #d3a24d; --serious: #d99a6c; --critical: #d68787;
    --good-bg: #1c2921; --warning-bg: #332818; --serious-bg: #332420; --critical-bg: #331e1e;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane); color: var(--text-primary);
  }
  #app { display: flex; min-height: 100vh; }

  /* ---- Side nav ---- */
  #sidenav {
    width: 220px; flex: 0 0 220px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--nav-bg) 100%, white 6%), var(--nav-bg) 55%);
    border-right: 1px solid var(--nav-border); padding: 20px 0; position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  #sidenav .brand { padding: 0 20px 18px; border-bottom: 1px solid var(--nav-border); margin-bottom: 10px; }
  #sidenav .brand-logo {
    background: #fff; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  #sidenav .brand-logo svg { display: block; width: 100%; height: auto; }
  #sidenav .brand-title { font-weight: 700; font-size: 13px; letter-spacing: 0.2px; color: var(--nav-text); }
  .nav-group {
    margin: 0 14px 16px;
  }
  .nav-separator {
    height: 1px; background: var(--nav-border); margin: 0 20px 16px;
  }
  .nav-item {
    display: flex; align-items: center; padding: 9px 14px; border-radius: 6px;
    border-left: 3px solid transparent;
    color: var(--nav-text-dim); cursor: pointer; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--nav-text); }
  .nav-item.active { background: var(--nav-active-bg); color: var(--nav-text); border-left-color: var(--series-1); font-weight: 700; }
  .nav-group-label {
    padding: 18px 20px 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--nav-text); display: flex; align-items: center; gap: 7px;
  }
  .nav-group-label::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--series-1); flex: 0 0 auto; }

  /* ---- Main content ---- */
  #main { flex: 1; padding: 28px 32px; max-width: 1200px; }
  .view { display: none; }
  .view.active { display: block; }

  /* Always-visible department context strip — sticks to the top of the viewport while a
     long form scrolls, so it's never ambiguous which department's data you're touching.
     Negative margins cancel #main's own padding so it spans flush edge-to-edge; its own
     padding re-establishes the page's usual left/right text alignment. */
  .dept-banner {
    position: sticky; top: 0; z-index: 10; margin: -28px -32px 24px; padding: 9px 32px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  }
  .dept-banner::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.85; }
  .dept-banner.plastics { background: linear-gradient(135deg, var(--series-1), var(--series-1-dark)); }
  .dept-banner.metals { background: linear-gradient(135deg, var(--accent-2), var(--accent-2-dark)); }
  h1.page-title { font-size: 22px; margin: 0 0 4px; }
  p.page-sub { color: var(--text-secondary); margin: 0 0 24px; font-size: 13.5px; }
  .page-title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .page-title-row .page-title { margin: 0; }
  .form-rev-info { font-size: 11px; line-height: 1.5; color: var(--text-muted); text-align: right; white-space: nowrap; padding-top: 3px; }

  /* ---- Controlled-document header — matches the CSC SOP/Form Template layout: logo,
     centered title, and a Doc No/Revision No/Revision Date block, used on forms that are
     released documents under the SQF program (e.g. Start-Up Verification). ---- */
  table.form-doc-header {
    width: 100%; border-collapse: collapse; table-layout: fixed;
    border: 1px solid var(--border); background: var(--surface-1); margin-bottom: 16px;
  }
  table.form-doc-header > tbody > tr > td { border: 1px solid var(--border); padding: 10px 16px; vertical-align: middle; }
  .form-doc-logo-cell { width: 200px; text-align: center; }
  .form-doc-logo { width: 165px; height: auto; display: block; margin: 0 auto 6px; }
  .form-doc-location { font-size: 11px; color: var(--text-secondary); }
  .form-doc-title-cell { text-align: center; font-size: 19px; font-weight: 700; color: var(--series-1); letter-spacing: 0.01em; }
  .form-doc-meta-cell { width: 230px; padding: 0 !important; }
  table.form-doc-meta { width: 100%; height: 100%; border-collapse: collapse; font-size: 12px; }
  table.form-doc-meta th, table.form-doc-meta td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; font-weight: 400; }
  table.form-doc-meta th { background: var(--surface-1); color: var(--text-secondary); font-weight: 700; white-space: nowrap; width: 45%; }
  .form-doc-footer {
    margin: 28px 0 8px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted); text-align: center;
  }

  /* ---- Run context banner — a darker, higher-contrast variant of .section-divider used
     specifically for the "which Run am I filling out" banner on the Checklist card, so it
     stands out from the plain category dividers around it. ---- */
  .run-context-banner {
    background: linear-gradient(135deg, var(--series-1), var(--series-1-dark));
    color: #fff; padding: 7px 12px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 8px;
  }

  /* ---- Page banner — a colored full-width header bar for a page's title + its primary
     actions (e.g. Daily Run Setup's "+ Add Run"), used instead of a plain <h1> when the page
     is dashboard-like rather than a document to read top-to-bottom. ---- */
  .page-banner {
    background: linear-gradient(135deg, var(--series-1-dark), color-mix(in srgb, var(--series-1-dark) 70%, black));
    color: #fff; padding: 14px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .page-banner.metals { background: linear-gradient(135deg, var(--accent-2-dark), color-mix(in srgb, var(--accent-2-dark) 70%, black)); }
  .page-banner-title { font-size: 24px; font-weight: 700; white-space: nowrap; }
  .page-head-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .page-head-actions .confirm-row { display: flex; align-items: center; gap: 8px; }
  .page-head-actions select { width: auto; min-width: 150px; }
  .page-head-actions button.ghost { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.5); }
  .page-head-actions button.ghost:hover { background: rgba(255,255,255,0.22); }
  .page-head-actions button.primary { background: linear-gradient(135deg, #fff, #eef2f5); color: var(--series-1-dark); border-color: #fff; }
  .page-head-actions button.primary:hover { filter: brightness(0.97); }
  .page-banner.metals .page-head-actions button.primary { color: var(--accent-2-dark); }

  .card-head-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .card-head-row h2 { font-size: 17px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
  .card-head-row .spec-hint { margin: 2px 0 0; }
  .today-chip {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary); background: var(--page-plane); border: 1px solid var(--border);
    padding: 3px 9px;
  }

  /* ---- Active Runs dashboard grid — richer than a plain qc-table: two-line cells (id +
     description), a bold Line chip, and a status-colored stripe down the row's left edge
     (set per-row via the --row-status-color custom property) instead of gridlines everywhere. ---- */
  table.run-grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.run-grid th {
    text-align: left; padding: 8px 12px; background: var(--header-bg); color: var(--text-secondary);
    font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 2;
  }
  table.run-grid td { padding: 10px 12px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  table.run-grid tbody tr:nth-child(even) td { background: var(--row-alt); }
  table.run-grid tbody tr:hover td { background: color-mix(in srgb, var(--series-1) 22%, var(--surface-1)); }
  table.run-grid tbody tr td:first-child { box-shadow: inset 4px 0 0 var(--row-status-color, var(--border)); }
  table.run-grid .cell-primary { font-weight: 700; color: var(--text-primary); }
  table.run-grid .cell-secondary { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  table.run-grid .cell-mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }
  table.run-grid .qty-cell { text-align: right; font-weight: 700; }
  .line-chip {
    display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 8px;
    border: 1.5px solid var(--series-1); color: var(--series-1); font-weight: 800; font-size: 13px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  .line-chip.metals { border-color: var(--accent-2); color: var(--accent-2); }
  .confirmed-yes { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 12px; }
  .confirmed-yes .check { color: var(--good); font-weight: 800; }
  .confirmed-no { color: var(--text-muted); font-size: 11.5px; font-style: italic; }

  /* ---- Slide-in side drawer (e.g. Add Run) — an alternative to an always-open inline form,
     used when the form is secondary to a dashboard-like list that should have the page's
     main attention. ---- */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(10,14,18,0.55); opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease; z-index: 500;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100vh; width: 440px; max-width: 92vw;
    background: var(--surface-1); border-left: 1px solid var(--border);
    box-shadow: -12px 0 32px rgba(0,0,0,0.25); z-index: 501;
    transform: translateX(100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  @media (prefers-reduced-motion: reduce) {
    .drawer, .drawer-overlay { transition: none; }
  }
  .drawer-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding: 18px 22px; border-bottom: 1px solid var(--border);
  }
  .drawer-head h2 { margin: 0 0 4px; font-size: 16px; }
  .drawer-head p { margin: 0; font-size: 12.5px; color: var(--text-secondary); }
  .drawer-close { border: none; background: transparent; font-size: 20px; line-height: 1; padding: 2px 6px; color: var(--text-muted); }
  .drawer-close:hover { color: var(--text-primary); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .drawer-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
  .field-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---- In-Process Line tab strip — a real tab bar (dark, all shades of blue) instead of a
     plain button row, so switching Lines reads as app chrome. Deliberately its own classes
     (ip-*), not the shared .line-tabs/.line-tab used by the Metals Ends In-Process and Data
     Analysis module tabs — those must stay untouched by this. Active tab flows straight into
     the context banner beneath it so tab + banner read as one "you are here" surface. */
  .ip-tabstrip-bar { background: linear-gradient(180deg, var(--series-1-dark), color-mix(in srgb, var(--series-1-dark) 70%, black)); padding: 10px 10px 0; }
  .ip-tabstrip-bar.metals { background: linear-gradient(180deg, var(--accent-2-dark), color-mix(in srgb, var(--accent-2-dark) 70%, black)); }
  .ip-tabstrip { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
  .ip-tab {
    background: rgba(255,255,255,0.1); border: 1px solid transparent; border-bottom: none;
    padding: 9px 18px 8px; cursor: pointer; min-width: 100px; position: relative;
    text-align: left; font-family: inherit; color: rgba(255,255,255,0.65);
  }
  .ip-tab .num { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; color: inherit; }
  .ip-tab .meta { font-size: 10.5px; color: rgba(255,255,255,0.45); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .ip-tab:not(.active):hover { background: rgba(255,255,255,0.2); color: #fff; }
  .ip-tab.active {
    background: linear-gradient(180deg, var(--series-1), var(--series-1-dark)); border-color: var(--series-1-dark);
    color: #fff; z-index: 2; box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
  }
  .ip-tabstrip-bar.metals .ip-tab.active { background: linear-gradient(180deg, var(--accent-2), var(--accent-2-dark)); border-color: var(--accent-2-dark); }
  .ip-tab.active .meta { color: rgba(255,255,255,0.8); }
  .ip-tab-add {
    border: 1px dashed rgba(255,255,255,0.4); color: rgba(255,255,255,0.8); font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 13px; min-width: 84px;
    background: transparent;
  }
  .ip-tab-add:hover { background: rgba(255,255,255,0.2); color: #fff; }

  .ip-context-banner {
    background: linear-gradient(135deg, var(--series-1), var(--series-1-dark)); color: #fff; border: 1px solid var(--series-1-dark);
    padding: 12px 18px; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; position: sticky; top: 38px; z-index: 15;
  }
  .ip-context-banner.metals { background: linear-gradient(135deg, var(--accent-2), var(--accent-2-dark)); border-color: var(--accent-2-dark); }
  .ip-context-banner .ipc-num { font-size: 20px; font-weight: 800; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .ip-context-banner .ipc-meta { font-size: 12.5px; opacity: 0.9; }
  .ip-context-banner .ipc-badge { background: rgba(255,255,255,0.18); padding: 3px 10px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .ip-panel-wrap { border: 1px solid var(--border); border-top: none; background: var(--surface-1); padding: 18px 20px; margin-bottom: 20px; }

  /* De-emphasized record resume/start-new controls — real capability (append to vs. start a
     fresh Record ID), just no longer a prominent always-open field+button pair. */
  .record-utility-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--gridline); font-size: 12px; color: var(--text-secondary);
  }
  .record-utility-row label { display: inline; margin: 0; text-transform: none; letter-spacing: normal; font-size: 12px; color: var(--text-secondary); }
  .record-id-input { width: auto; min-width: 150px; max-width: 200px; padding: 4px 7px; font-size: 12.5px; }
  button.link-btn {
    background: none; border: none; padding: 0; color: var(--series-1); font-size: 12px; font-weight: 600;
    text-decoration: underline;
  }
  button.link-btn:hover { color: var(--series-1-dark); filter: none; }

  /* ---- Stat tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; margin-bottom: 24px; background: var(--border); border: 1px solid var(--border); }
  .tile {
    background: var(--surface-1); border-radius: 0; padding: 14px 16px;
  }
  .tile .label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tile .value { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .value.good { color: var(--good); }
  .tile .value.critical { color: var(--critical); }
  .tile .value.warning { color: var(--warning); }

  section.card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 0;
    padding: 18px 20px; margin-bottom: 20px;
  }
  section.card h2 { font-size: 15px; margin: 0 0 14px; }

  table.qc-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--gridline); }
  table.qc-table th, table.qc-table td {
    text-align: left; padding: 4px 10px; border: 1px solid var(--gridline); font-variant-numeric: tabular-nums; line-height: 1.3;
  }
  table.qc-table th { background: var(--header-bg); color: var(--text-secondary); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.qc-table tbody tr:nth-child(even) td { background: var(--row-alt); }

  /* Scrollable table with a frozen (sticky) header row — used by Data Analysis
     and the Add Run active-runs grids. */
  .scroll-table-wrap { overflow: auto; max-height: 60vh; }
  .scroll-table-wrap table.qc-table th { position: sticky; top: 0; z-index: 2; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px 2px 7px; border-radius: 0; border-left: 3px solid; font-size: 12px; font-weight: 600; }
  .badge.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
  .badge.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical); }
  .badge.serious { background: var(--serious-bg); color: var(--serious); border-color: var(--serious); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

  /* ---- Forms ---- */
  label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  input, select, textarea {
    width: 100%; padding: 5px 9px; border: 1px solid var(--border); border-radius: 0;
    background: var(--surface-1); color: var(--text-primary); font-size: 13.5px; font-family: inherit; line-height: 1.3;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  textarea { min-height: 60px; resize: vertical; font-family: inherit; }
  .field { margin-bottom: 8px; }
  .field-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .field.field-wide { grid-column: span 2; }

  .section-divider {
    background: var(--page-plane); border: 1px solid var(--border); border-left: 3px solid var(--series-1);
    padding: 3px 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-secondary); margin: 10px 0 8px;
  }
  .row-card .section-divider { margin-top: 0; }

  /* Compact variant — used by the Add Run entry form so it takes up less room and
     doesn't compete visually with the Active Runs list below it. */
  .form-compact label { font-size: 10px; margin-bottom: 2px; }
  .form-compact input, .form-compact select { font-size: 12px; padding: 4px 7px; }
  .form-compact .field { margin-bottom: 6px; }
  .form-compact h2 { font-size: 13px; }

  /* Emphasis variant — used by the Active Runs list so it stands out as the primary,
     glanceable content on the page rather than the entry form above it. */
  section.card.card-highlight { border-left: 4px solid var(--series-1); }
  section.card.card-highlight.metals { border-left-color: var(--accent-2); }
  section.card.card-highlight h2 { font-size: 17px; }

  /* Fixed-layout run tables — column widths stay put as rows are added/removed instead
